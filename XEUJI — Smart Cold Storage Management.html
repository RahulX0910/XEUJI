const FAQ=[['What does the dashboard show?','Live status for temperature, humidity, gas index, power, battery, cooling and storage condition for all three chambers.'],['Why is my chamber showing WARNING?','A chamber enters WARNING when a parameter approaches or exceeds its configured limits (temperature range, humidity warning, gas warning).'],['What happens when solar power is low?','The system moves to battery-supported operation according to the selected power mode (Auto, Solar priority, Battery save, Grid support).'],['What happens during a power outage?','Battery backup continues (simulated) cooling support while the operator is alerted.'],['What does MQ-4 monitor?','The MQ-4 sensor is used for gas/methane-related monitoring. In this demo its index (0-100) is simulated, not calibrated ppm.'],['What is spoilage risk?','A demo prediction that combines simulated temperature deviation, humidity, gas index and abnormal-event duration. It is not a validated forecast.'],['Does internet failure stop the system?','The intended design is local-first: local monitoring and control continue while remote monitoring depends on connectivity.'],['Can I control all three chambers separately?','Yes. Each chamber has independent monitoring and simulated control.'],['Can one chamber use a different crop profile?','Yes, within the range limits of the system. Verify crop suitability yourself.'],['How often does demo data update?','Every 10 seconds by default; 30 or 60 seconds in Settings.']],

function help(){return`<h1>${t('help')}</h1><div class="f"><input type="search" placeholder="${t('srch')} FAQ…" aria-label="Search FAQ" oninput="const q=this.value.toLowerCase();document.querySelectorAll('.fq').forEach(e=>e.style.display=e.textContent.toLowerCase().includes(q)?'':'none')"></div><div class="g2" style="grid-template-columns:1fr 1fr"><div class="cd"><h3>Frequently asked questions</h3>${FAQ.map(([q,a])=>`<details class="fq"><summary>${q}</summary><p>${a}</p></details>`).join('')}</div><div class="cd"><h3>Quick start</h3>${['Check system status','Verify chamber conditions','Select crop profile','Review power state','Monitor alerts and analytics'].map((s,i)=>`<div class="st"><b>${i+1}</b><span>${s}</span></div>`).join('')}<h3>Guides</h3><p class="mu"><b>Sensors:</b> temperature and humidity per chamber, MQ-4 gas (simulated index).<br><b>Controls:</b> cooling, fan and heater ON/OFF/AUTO; power mode; battery reserve; safe shutdown (confirmed).<br><b>Alerts:</b> INFO, WARNING, CRITICAL — acknowledge, resolve, review history.<br><b>Storage basics:</b> leafy vegetables 0-5°C, tomato/chilli 5-8°C, onion/potato 10-15°C (project demo profiles).</p></div></div><div class="cd"><h3>Troubleshooting</h3><div class="tw"><table><thead><tr><th>Issue</th><th>Possible cause</th><th>Recommended action</th></tr></thead><tbody>${TS.map(r=>'<tr>'+r.map(c=>`<td style="white-space:normal">${c}</td>`).join('')+'</tr>').join('')}</tbody></table></div></div><div class="g3"><div class="cd"><h3>Core project</h3><p class="mu">Three chambers, solar PV, MPPT, LiFePO4 battery, grid support, ESP32, temperature/humidity/MQ-4 sensing, cooling, local buzzer, dashboard, alerts.</p></div><div class="cd"><h3>Demo extensions</h3><p class="mu">Simulated telemetry, simulated AI spoilage prediction, mock controls, demo analytics.</p></div><div class="cd"><h3>Future integration</h3><p class="mu">Real ESP32, Firebase, MQTT, SMS gateway and a trained prediction model.</p></div></div><div class="cd" style="margin-top:12px"><h3>Contact / support</h3><p class="mu">Contact the XEUJI SIH2026 project team for hardware support.</p></div>`}
/* ---------- router ---------- */
const PAGES={dash,ana,ctl,past,alr,set,help},NAV=[['dash','d'],['ana','n'],['ctl','k'],['past','p'],['alr','a'],['set','g'],['help','q']];
function go(p){PG=p;render();scrollTo(0,0)}
function render(){applyTheme();Object.keys(CH).forEach(k=>{CH[k].destroy();delete CH[k]});$('#lg2').value=ST.lang;
 $('#nav').innerHTML='<div class="logo">XEUJI</div><div class="sub mu">SMART COLD STORAGE</div>'+NAV.map(([p,i])=>`<button class="${p===PG?'on':''}" onclick="go('${p}')" ${p===PG?'aria-current="page"':''}>${ic(i)}<span>${t(p)}</span></button>`).join('');
 $('#pg').innerHTML=PAGES[PG]();if(PG==='dash'){mkC('cA');draw()}else if(PG==='ana'){mkC('cB');mkC('cD','doughnut');aUp()}else if(PG==='ctl')ctlLive();else if(PG==='past')ptb();else if(PG==='alr')alrList();hdr()}
init();timers();matchMedia('(prefers-color-scheme:dark)').addEventListener('change',()=>{if(ST.theme==='system')render()});
setInterval(()=>{const e=$('#ag');if(e)e.textContent=Math.round((Date.now()-S.last)/1000)},1000);render();
</script></body></html>
